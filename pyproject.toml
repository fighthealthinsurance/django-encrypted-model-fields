[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlc-django-encrypted-filefield"
version = "0.4.0"
description = "Encrypt uploaded files, store them wherever you like and stream them back unencrypted"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Quinn", email = "code@danielquinn.org" },
]
maintainers = [
    { name = "Fight Health Insurance" },
]
keywords = [
    "django",
    "encryption",
    "filefield",
    "encrypted-files",
    "s3",
    "security",
    "fernet",
    "upload",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "django>=5.0",
    "cryptography>=38.0",
    "requests>=2.20.0",
    "python-magic>=0.4.12",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "coverage",
    "isort",
    "pylint",
    "tox",
]

[project.urls]
Homepage = "https://github.com/fighthealthinsurance/django-encrypted-model-fields"
Repository = "https://github.com/fighthealthinsurance/django-encrypted-model-fields"
Issues = "https://github.com/fighthealthinsurance/django-encrypted-model-fields/issues"
Changelog = "https://github.com/fighthealthinsurance/django-encrypted-model-fields/blob/django5x/CHANGES.rst"

[tool.setuptools.packages.find]
include = ["django_encrypted_filefield*"]

[tool.coverage.run]
branch = true
source = ["django_encrypted_filefield"]
omit = ["*/tests/*"]

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.isort]
atomic = true
multi_line_output = 3
case_sensitive = true
lines_after_imports = 2
lines_between_types = 1
combine_as_imports = true
default_section = "THIRDPARTY"
known_django = "django"
line_length = 79
include_trailing_comma = true
sections = [
    "FUTURE",
    "STDLIB",
    "DJANGO",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.black]
line-length = 79
target-version = ["py310"]
include = '\.pyi?$'
exclude = '/(\.eggs|\.git|_build|build|dist)/'
