name: Pylint

on:
  push:
    branches: ["django5x"]
  pull_request:
    branches: ["django5x"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox
      - name: Run pylint
        run: tox -e pylint
