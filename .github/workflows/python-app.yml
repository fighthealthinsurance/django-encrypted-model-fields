name: Tests

on:
  push:
    branches: ["django5x"]
  pull_request:
    branches: ["django5x"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox
      - name: Lint with black
        run: tox -e black

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["50", "51", "52"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install tox
          pip install .
      - name: Run tests
        run: |
          PY_VERSION=$(echo "${{ matrix.python-version }}" | tr -d '.')
          tox -e "py${PY_VERSION}-django${{ matrix.django-version }}"
