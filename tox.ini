[pycodestyle]
max-line-length = 120
exclude=.tox,.git,*/migrations/*,*/static/CACHE/*,docs,node_modules

[tox]
envlist = {py310,py311,py312,py313}-django{50,51,52}
recreate = true

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
deps =
    .
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
setenv =
    DEFF_SALT=salt
    DEFF_PASSWORD=password
    DEFF_FETCH_URL_NAME=fetch
commands =
    python manage.py test

[testenv:black]
basepython = python3
passenv = *
deps =
    setuptools
    black
allowlist_externals = black
commands =
    black --check django_encrypted_filefield

[testenv:pyright]
basepython = python3
passenv = *
deps =
    setuptools
    pyright
allowlist_externals = pyright
commands =
    pyright django_encrypted_filefield
