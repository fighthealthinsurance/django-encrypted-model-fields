[tox]
envlist = {py310,py311,py312,py313}-django{50,51,52}

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
deps =
    .
    coverage
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
setenv =
    DEFF_SALT=salt
    DEFF_PASSWORD=password
    DEFF_FETCH_URL_NAME=fetch
commands =
    coverage run manage.py test
    coverage report -m

[testenv:black]
basepython = python3
deps =
    black
commands =
    black --check django_encrypted_filefield

[testenv:pylint]
basepython = python3
deps =
    .
    pylint
commands =
    pylint django_encrypted_filefield --ignore=tests

[testenv:pyright]
basepython = python3
deps =
    .
    pyright
    django-stubs
commands =
    pyright django_encrypted_filefield
